    <script>
    function validarSector() {
        const sector = document.getElementById("sector").value.trim();
        const error = document.getElementById("error-sector");
        error.textContent = "";

        if (sector.length > 100) {
            error.textContent = "Demasiados caracteres";
            return false;
        }

        else {
            return true;
        }
    }

    <h3> ¿Cómo se contacta? </h3>
        <br>
    <form class="formulario-caja">
    <label> Nombre completo: </label>
    <input type="text" id="nombre" maxlength="200" minlength="3" name="nombre" class="input-texto" placeholder="Escriba aquí" required onblur="validarNombre()">
    <small id="error-nombre" style="color:red"></small>
    <br><br>
    <label> Correo electrónico: </label>
    <input type="email" id="correo" maxlength="100" minlength="5" name="correo" class="input-texto" placeholder="Ej: nombre@xxx.xxx" required onblur="validarCorreo()">
    <small id="error-correo" style="color:red"></small> 
    <br><br>
    <label> Teléfono: </label>
    <input type="tel" id="telefono" maxlength="13" name="telefono" class="input-texto" placeholder="+NNN.NNNNNNNN" onblur="validarTelefono()">
    <small id="error-telefono" style="color:red"></small> 
    <br><br>
    <label for="contacto"> Contactar mediante: </label>
    <select id="contacto" name="contacto">
        <option value="" disabled selected> Elija método </option>
        <option value="wsp"> WhatsApp </option>
        <option value="telegram"> Telegram </option>
        <option value="ig"> Instagram </option>
        <option value="tiktok"> TikTok </option>
        <option value="facebook"> Facebook Messenger </option>
        <option value="twitter"> Twitter </option>
        <option value="linkedin"> LinkedIn </option>
        <option value="ds"> Discord </option>
    </select>
    <input type="url" id="url" maxlength="50" minlength="4" class="input-texto" name="url" placeholder="ID o URL" onblur="validarURL()">
    <small id="error-url" style="color:red"></small>
    </form>
    <script>
    function validarNombre() {
        const nombre = document.getElementById("nombre").value.trim();
        const error = document.getElementById("error-nombre");
        error.textContent = "";

        if (nombre.length > 200) {
            error.textContent = "Demasiados caracteres";
            return false;
        }

        if (nombre.length < 3) {
            error.textContent = "Pocos caracteres";
            return false;
        }

        else {
            return true;
        }
    }

    function validarCorreo() {
        const correo = document.getElementById("correo").value.trim();
        const error = document.getElementById("error-correo");
        error.textContent = "";

        if (correo.length > 100) {
            error.textContent = "Demasiados caracteres";
            return false;
        }

        if (correo.length < 5) {
            error.textContent = "Pocos caracteres";
            return false;
        }

        if (!correo.includes("@") || !correo.includes(".")) {
            error.textContent = "Formato erróneo";
        }

        else {
            return true;
        }
    }

    function validarTelefono() {
        const telefono = document.getElementById("telefono").value.trim();
        const error = document.getElementById("error-telefono");
        error.textContent = "";

        if (telefono.length > 13) {
            error.textContent = "Demasiados dígitos";
            return false;
        }

        if (telefono.lenght < 13) {
            error.textContent = "Pocos dígitos";
            return false;
        }

        if (telefono[0] !== "+" || telefono[4] !== ".") {
            error.textContent = "Formato erróneo";
            return false;
        }

        else {
            return true;
        }
    }

    function validarURL() {
        const url = document.getElementById("url").value.trim();
        const error = document.getElementById("error-url");
        error.textContent = "";

        if (url.length > 50) {
            error.textContent = "Demasiados caracteres";
            return false;
        }

        if (url.length < 4) {
            error.textContent = "Pocos caracteres";
            return false;
        }

        else {
            return true;
        }
    }
    </script>

    <h3> ¿Qué mascotas se adoptan? </h3>
    <br>
    <form class="formulario-caja">
    <label for="tipo"> Tipo de animal: </label>
    <select id="tipo" name="tipo" required>
        <option value="" disabled selected> Elija una opción </option>
        <option value="perro"> Perro </option>
        <option value="gato"> Gato </option>
    </select>
    <br>
    <label> Cantidad: </label>
    <input type="number" id="cantidad" minlength="1" name="cantidad" class="input-texto" placeholder="Escriba aquí" onblur="validarCantidad()" required>
    <small id="error-cantidad" style="color:red"></small> 
    <br><br>
    <label> Edad: </label>
    <input type="number" id="edad" minlength="1" name="edad" class="input-texto" placeholder="Escriba aquí" onblur="validarEdad()" required>
    <small id="error-edad" style="color:red"></small>
    <br><br>
    <label for="medida"> Medida de la edad: </label>
    <select id="medida" name="medida" required>
        <option value="" disabled selected> Elija una opción </option>
        <option value="perro"> Mes/es </option>
        <option value="gato"> Año/s </option>
    </select>
    <br><br>
    <label for="fecha"> Fecha de entrega: </label>
    <input type="datetime-local" id="fecha" name="fecha" class="input-texto" required>
    <small id="error-fecha" style="color:red"></small>
    <br><br>
    <label> Descripción: </label>
    <input type="descripcion" id="descripcion" maxlength="500" name="nombre" class="input-texto" placeholder="Escriba aquí" required onblur="validarNombre()">
    <small id="error-descripcion" style="color:red"></small>
    <br><br>
    <label>Fotografías:</label>
    <input type="file" id="foto" class="input-texto" name="foto" accept="image/*" multiple onchange="validarFotos()" required>
    <small id="error-foto" style="color:red"></small>
    </form>
    <script>

    <script>
    function validarCantidad() {
        const cantidad = document.getElementById("cantidad").value.trim();
        const error = document.getElementById("error-cantidad");
        error.textContent = "";

        if (cantidad < 1) {
            error.textContent = "El mínimo es 1 animal";
            return false;
        }

        else {
            return true;
        }
    }

    function validarEdad() {
        const edad = document.getElementById("edad").value.trim();
        const error = document.getElementById("error-edad");
        error.textContent = "";

        if (edad < 1) {
            error.textContent = "El mínimo es 1 animal";
            return false;
        }

        else {
            return true;
        }
    }

    function validarDescripcion() {
        const descripcion = document.getElementById("descripcion").value.trim();
        const error = document.getElementById("error-descripcion");
        error.textContent = "";

        if (descripcion > 500) {
            error.textContent = "Demasiados caracteres";
            return false;
        }

        else {
            return true;
        }
    }

    function validarFotos() {
        const input = document.getElementById("foto");

        }

    </script>
