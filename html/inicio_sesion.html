<!DOCTYPE html>

<head>

    <link rel="icon" type="image/webp" href="../recursos/icon_observatorio_digital_aviario.webp">

    <meta property="og:title" content="Observatorio Digital Aviario | Inicio de sesión">

    <meta property="og:image" content="../recursos/og_logo_observatorio_aviario.webp">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/formulario.css">
    <link rel="stylesheet" href="../css/registro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
</head>
<body>
    <header>
        <div class="logo-contenedor">
            <a href="pagina_principal.html">
                <img src="../recursos/logo_observatorio_digital_aviario.webp" alt="Logo de Observatorio Digital Aviario.">
            </a>
        </div>
        <a href="pagina_principal.html" class="boton-volver-principal">Volver a la página principal</a>
    </header>
    <main>
        <h2 class="titulo-seccion">Ingresa con tu cuenta</h2>
        <form method="POST" class="formulario" id="formulario-inicio-sesion">
            <div class="grupo-formulario">
                <label for="correo">Correo electrónico <span class="texto-rojo">*</span></label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="grupo-formulario">
                <label for="contrasena">Contraseña <span class="texto-rojo">*</span></label>
                <input type="password" id="contrasena" name="contrasena" required>
            </div>
            <button type="submit" class="boton-formulario-inicio-sesion">Ingresar</button>
        </form>
        <p class="ayuda-inicio-sesion">
            <a href="registro_usuario.html">¿Aún no tienes una cuenta? Clickea aquí para crear.</a>
        </p>
        <p class="ayuda-inicio-sesion">
            <a href="pagina_principal.html#contacto">¿Problemas para iniciar sesión?</a>
        </p>
    </main>
    <footer>
        <div class="footer-contenedor">
            <div class="footer-logo">
                <a href="pagina_principal.html">
                    <img src="../recursos/logo_observatorio_digital_aviario_white.webp" alt="Logo blanco de Observatorio Digital Aviario.">
                </a>
            </div>
            <div class="footer-contacto">
                <h3>¡Contáctanos!</h3>
                <p class="linea-contacto">
                    <svg class="icono-correo icono-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                        <path d="M3 7l9 6 9-6"></path>
                    </svg>
                    <a href="mailto:contacto@oda.cl">contacto@observatorioaviario.cl</a>
                </p>
                <p class="linea-contacto">
                    <a href="https://wa.me/56912345678">
                        <img src="../recursos/icon_whatsapp_black.webp" alt="WhatsApp">
                    </a>
                    <a href="tel:+56912345678">+56 9 1234 5678</a>
                </p>
            </div>
            <div class="footer-redes">
                <h3>¡Síguenos en nuestras redes!</h3>
                <div class="iconos-redes">
                    <a href="https://instagram.com">
                        <img src="../recursos/icon_instagram_black.webp" alt="Síguenos en Instagram.">
                    </a>
                    <a href="https://youtube.com">
                        <img src="../recursos/icon_youtube_black.webp" alt="Síguenos en YouTube.">
                    </a>
                    <a href="https://facebook.com">
                        <img src="../recursos/icon_facebook_black.webp" alt="Síguenos en Facebook.">
                    </a>
                </div>
            </div>
        </div>
        <div class="footer-legal">
            <p>&copy; Todos los derechos reservados <span id="anio-actual">2026</span>.</p>
        </div>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="../js/navegacion_global.js"></script>
    <script src="../js/inicio_sesion.js"></script>
</body>
</html>
