<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observatorio Digital Aviario | Inicio de sesión</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/formulario.css">
    <link rel="stylesheet" href="../css/registro.css">
</head>
<body>
    <header>
        <div class="logo-contenedor">
            <a href="pagina_principal.html">
                <img src="../recursos/logo_observatorio_digital_aviario.png" alt="Logo de Observatorio Digital Aviario.">
            </a>
        </div>
        <a href="pagina_principal.html" class="boton-volver-principal">Volver a la página principal</a>
    </header>
    <main>
        <h2 class="titulo-seccion">Ingresa con tu cuenta</h2>
        <form method="POST" class="formulario" id="formulario-inicio-sesion">
            <div class="grupo-formulario">
                <label for="correo">Correo electrónico <span class="texto-rojo">*</span></label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="grupo-formulario">
                <label for="contrasena">Contraseña <span class="texto-rojo">*</span></label>
                <input type="password" id="contrasena" name="contrasena" required>
            </div>
            <button type="submit" class="boton-formulario-inicio-sesion">Ingresar</button>
        </form>
        <p class="ayuda-inicio-sesion">
            <a href="registro_usuario.html">¿Aún no tienes una cuenta? Clickea aquí para crear.</a>
        </p>
        <p class="ayuda-inicio-sesion">
            <a href="pagina_principal.html#contacto">¿Problemas para iniciar sesión?</a>
        </p>
    </main>
    <footer>
        <div class="footer-contenedor">
            <div class="footer-logo">
                <a href="pagina_principal.html">
                    <img src="../recursos/logo_observatorio_digital_aviario_white.png" alt="Logo blanco de Observatorio Digital Aviario.">
                </a>
            </div>
            <div class="footer-contacto">
                <p class="linea-contacto">
                    <span class="icono-correo" aria-hidden="true">✉</span>
                    <a href="mailto:contacto@oda.cl">contacto@observatorioaviario.cl</a>
                </p>
                <p class="linea-contacto">
                    <a href="https://wa.me/56912345678">
                        <img src="../recursos/icon_whatsapp_black.png" alt="WhatsApp">
                    </a>
                    <a href="tel:+56912345678">+56 9 1234 5678</a>
                </p>
            </div>
            <div class="footer-redes">
                <h3>¡Síguenos en nuestras redes!</h3>
                <div class="iconos-redes">
                    <a href="https://instagram.com">
                        <img src="../recursos/icon_instagram_black.png" alt="Síguenos en Instagram.">
                    </a>
                    <a href="https://youtube.com">
                        <img src="../recursos/icon_youtube_black.png" alt="Síguenos en YouTube.">
                    </a>
                    <a href="https://facebook.com">
                        <img src="../recursos/icon_facebook_black.png" alt="Síguenos en Facebook.">
                    </a>
                </div>
            </div>
        </div>
        <div class="footer-legal">
            <p>&copy; Todos los derechos reservados 2026.</p>
        </div>
    </footer>
    <script src="../js/inicio_sesion.js"></script>
</body>
</html>
