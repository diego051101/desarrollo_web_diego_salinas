<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/formulario.css">
</head>
<body>
    <header>
        <div class="logo-contenedor">
            <a href="pagina_principal_sesion_iniciada.html">
                <img src="../recursos/logo_observatorio_digital_aviario.png" alt="Logo de Observatorio Digital Aviario.">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="pagina_principal_sesion_iniciada.html">Página principal</a> / </li>
                <li><a href="avistamientos.html">Avistamientos</a> / </li>
                <li><a href="metricas.html">Métricas</a> / </li>
            </ul>
        </nav>
        <div class="sesion-iniciada">
            <button>
                <img src="../recursos/profile_picture_placeholder_1.jpg" alt="Imagen de tu perfil."> 
                <h3 class="header-nombre-usuario">Catalina López</h3>
                <span class="icono-desplegable">↓</span>
            </button>
            <nav id="menu-desplegable-perfil" class="menu-perfil-oculto">
                <a href="configuracion.html">Configuración</a>
                <a href="pagina_principal.html">Cerrar sesión</a>
            </nav>
        </div>
    </header>
    <main>
        <h2 class="titulo-seccion">¡Publica tu hallazgo!</h2>
        <form method="POST" class="formulario" id="formulario-avistamiento">
            <div class="fila-doble">
                <div class="grupo-formulario-mitad">
                    <label for="nombre-ave">Nombre del ave <span class="texto-rojo">*</span></label>
                    <input type="text" id="nombre-ave" name="nombre-ave" placeholder="Ej: Cóndor Andino" required>
                </div>
                <div class="grupo-formulario-mitad">
                    <label for="tipo-ave">Tipo del ave <span class="texto-rojo">*</span></label>
                    <input type="text" id="tipo-ave" name="tipo-ave" placeholder="Ej: Ave de presa" required>
                </div>
            </div>
            <div class="grupo-formulario">
                <label for="lugar-ave">Lugar del encuentro <span class="texto-rojo">*</span></label>
                <input type="text" id="lugar-ave" name="lugar-ave" placeholder="Ej: Cajón del Maipo" required>
            </div>
            <div class="fila-doble">
                <div class="grupo-formulario-mitad">
                    <label for="hora-ave">Hora del encuentro <span class="texto-rojo">*</span></label>
                    <input type="time" id="hora-ave" name="hora-ave" placeholder="Ej: 14:26" required>
                </div>
                <div class="grupo-formulario-mitad">
                    <label for="fecha-ave">Fecha del encuentro <span class="texto-rojo">*</span></label>
                    <input type="date" id="fecha-ave" name="fecha-ave" placeholder="DD/MM/AA" required>
                </div>
            </div>
            <div>
                <label for="evidencia">Adjuntar fotografía o video <span class="texto-rojo">*</span></label>
                <input type="file" id="evidencia" name="evidencia" accept="image/*, video/*" required class="input-adjuntar">
                <small class="texto-ayuda">Formatos permitidos: JPG, PNG o MP4. Peso máximo: 5 MB.</small>
            </div>
            <button type="submit" class="boton-formulario-avistamiento">Enviar</button>
        </form>
    </main>
    <footer>
        <div class="footer-contenedor">
            <div class="footer-logo">
                <a href="pagina_principal_sesion_iniciada.html">
                    <img src="../recursos/logo_observatorio_digital_aviario_white.png" alt="Logo blanco de Observatorio Digital Aviario.">
                </a>
            </div>
            <div class="footer-contacto">
                <p class="linea-contacto">
                    <span class="icono-correo" aria-hidden="true">✉</span>
                    <a href="mailto:contacto@oda.cl">contacto@observatorioaviario.cl</a>
                </p>
                <p class="linea-contacto">
                    <a href="https://wa.me/56912345678">
                        <img src="../recursos/icon_whatsapp_black.png" alt="WhatsApp">
                    </a>
                    <a href="tel:+56912345678">+56 9 1234 5678</a>
                </p>
            </div>
            <div class="footer-redes">
                <h3>¡Síguenos en nuestras redes!</h3>
                <div class="iconos-redes">
                    <a href="https://instagram.com">
                        <img src="../recursos/icon_instagram_black.png" alt="Síguenos en Instagram.">
                    </a>
                    <a href="https://youtube.com">
                        <img src="../recursos/icon_youtube_black.png" alt="Síguenos en YouTube.">
                    </a>
                    <a href="https://facebook.com">
                        <img src="../recursos/icon_facebook_black.png" alt="Síguenos en Facebook.">
                    </a>
                </div>
            </div>
        </div>
        <div class="footer-legal">
            <p>&copy; Todos los derechos reservados 2026.</p>
        </div>
    </footer>
    <script src="../js/registro_avistamiento.js"></script>
</body>
</html>
